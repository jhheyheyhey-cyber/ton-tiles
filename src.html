<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16131f">
<title>Ton-Tiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Querformat — schmale Leiste oben, Notenbahn, Klaviatur am unteren Rand; Liedmenü als Vollbild-Ebene */
:root{
  --bg:#16131f; --panel:#211c2e; --line:#2e2840; --fg:#f2eff8; --muted:#958da8;
  --rh:#8d72ff; --lh:#2fc4b2; --ok:#5ee39a; --warn:#ff7a8a;
  --white:#f6f3fb; --white-edge:#c9c2d6; --black:#1b1726;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:600 .85rem var(--display);color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:6px 11px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--rh);outline-offset:2px}
button.primary{background:var(--rh);border-color:transparent;color:#fff}

#bar{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,#221c33,#18142400)}
#songTitle{flex:1 1 auto;min-width:0;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#heard{flex:none;width:7.5em;font:600 1rem/1 var(--mono);color:var(--ok);white-space:nowrap;overflow:hidden;text-align:right}
#want{flex:none;width:4.8em;font:500 .8rem var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#lvl{flex:none;width:34px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#lvl i{display:block;height:100%;width:0;background:var(--lh)}
#stage{position:relative;flex:1 1 auto;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* Liedmenü */
#menu{position:fixed;inset:0;z-index:5;overflow-y:auto;
  background:radial-gradient(1200px 500px at 0% -10%,#3a2a7a55,transparent 60%),radial-gradient(900px 500px at 110% 0%,#1d6b6233,transparent 60%),var(--bg);
  padding:max(18px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto}
#menu header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.logo{display:flex;gap:2px;align-items:flex-end;height:34px}
.logo i{display:block;width:9px;border-radius:2px 2px 3px 3px;background:var(--white)}
.logo i:nth-child(1){height:34px}.logo i:nth-child(2){height:22px;background:var(--rh)}.logo i:nth-child(3){height:34px}.logo i:nth-child(4){height:26px;background:var(--lh)}.logo i:nth-child(5){height:34px}
#menu h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1}
#menu header p{margin:0;color:var(--muted);font-size:.92rem;flex:1 1 28ch;line-height:1.4}
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.chip{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--fg);background:#ffffff0a;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip input{accent-color:var(--rh);margin:0}
.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:#ffffff0a;border:1px solid var(--line);font-size:.85rem}
.seg>span{color:var(--muted);padding:0 8px 0 9px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--rh);color:#fff}
.sec{display:flex;align-items:baseline;gap:10px;margin:20px 0 10px}
.sec h2{margin:0;font-size:1rem;font-weight:700;letter-spacing:.01em}
.sec span{font:500 .75rem var(--mono);color:var(--muted)}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots.l1 i:nth-child(-n+1),.dots.l2 i:nth-child(-n+2),.dots.l3 i:nth-child(-n+3){background:var(--lvc)}
.dots.l1{--lvc:var(--ok)}.dots.l2{--lvc:#ffc65c}.dots.l3{--lvc:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.song{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-width:0;
  background:linear-gradient(165deg,#2a2340,#1c1829);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px 12px;display:grid;grid-template-rows:1fr auto auto;gap:9px;transition:transform .15s,border-color .15s,box-shadow .15s}
.song:hover{transform:translateY(-2px);border-color:#5b4aa8;box-shadow:0 10px 24px -12px #000}
.song:focus-visible{outline:2px solid var(--rh);outline-offset:2px}
.song .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.song b{font-size:1.02rem;font-weight:700;line-height:1.2}
.song small{color:var(--muted);font-size:.8rem;display:block;margin-top:3px}
.badge{flex:none;font:600 .68rem var(--mono);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-radius:999px;padding:2px 7px;white-space:nowrap}
.range{position:relative;height:14px;border-radius:4px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#ffffff16 0 calc(100%/52 - 1px),transparent calc(100%/52 - 1px) calc(100%/52))}
.range span{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--lh),var(--rh));opacity:.85}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 .72rem var(--mono);color:var(--muted)}
.hands{display:inline-flex;gap:5px;align-items:center}
.hands i{width:8px;height:8px;border-radius:2px;background:var(--rh)}.hands i.l{background:var(--lh)}
.song.add{border-style:dashed;background:#ffffff06;place-content:center;justify-items:center;text-align:center;min-height:118px;gap:4px}
.song.add .plus{font-size:1.7rem;line-height:1;color:var(--rh)}
.song.add small{max-width:30ch}
.del{position:absolute;right:8px;bottom:8px;font:600 .72rem var(--display);padding:3px 9px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--line)}
.del.armed{background:var(--warn);color:#fff;border-color:transparent}
.song.custom .meta{padding-right:70px}
#menuNote{color:var(--warn);font-size:.85rem;margin-top:10px}
#menuNote:empty{display:none}

#done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px)}
.donecard{display:grid;justify-items:center;gap:10px;padding:22px 28px;border-radius:18px;
  background:linear-gradient(165deg,#2a2340,#1c1829);border:1px solid var(--line);box-shadow:0 20px 50px -20px #000}
.donecard .tick{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-size:1.5rem}
.donecard strong{font-size:1.6rem}
.donecard span{color:var(--muted);font-family:var(--mono);font-size:.85rem}
.donecard div{display:flex;gap:8px}
#prog{flex:none;height:3px;background:#ffffff0d}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lh),var(--rh));transition:width .25s}

#rotate{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#rotate svg{width:64px;height:64px}
#rotate p{margin:0;color:var(--muted);max-width:28ch}
@media (orientation:portrait){body.playing #rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#lvl i,#prog i,.song{transition:none}}
</style>
</head>
<body>
<div id="bar">
  <button id="openMenu" aria-label="Liedauswahl öffnen">☰ Lieder</button>
  <div id="songTitle">–</div>
  <div id="heard" aria-live="off">–</div>
  <div id="lvl" title="Mikrofon-Pegel"><i></i></div>
  <div id="want">0/0</div>
  <button id="back" aria-label="Einen Schritt zurück">◀</button>
  <button id="restart" aria-label="Lied von vorn">↺</button>
</div>
<div id="prog"><i></i></div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="done" hidden>
    <div class="donecard">
      <div class="tick">✓</div>
      <strong>Geschafft!</strong>
      <span id="doneStats"></span>
      <div><button class="primary" id="again">Nochmal</button><button id="toMenu">Anderes Lied</button></div>
    </div>
  </div>
</div>

<div id="menu"><div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <h1>Ton-Tiles</h1>
    <p>Lied wählen, Handy quer ans Klavier stellen und spielen. Es geht erst weiter, wenn alle Töne richtig klingen.</p>
  </header>
  <div class="opts">
    <div class="seg" role="group" aria-label="Notennamen"><span>Notennamen</span><button type="button" data-names="de">C D E … H</button><button type="button" data-names="en">C D E … B</button><button type="button" data-names="solf">Do Re Mi</button></div>
    <label class="chip"><input type="checkbox" id="strict"> Oktave genau prüfen</label>
    <label class="chip"><input type="checkbox" id="noMic"> Ohne Mikrofon (Tasten antippen)</label>
  </div>
  <div id="menuNote"></div>
  <input type="file" id="importFile" accept=".mid,.midi,.musicxml,.xml,.mxl,audio/midi,audio/x-midi" hidden>
  <div id="list"></div>
</div></div>

<div id="rotate">
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="6" width="24" height="40" rx="4"/><path d="M8 50h36a4 4 0 0 0 4-4"/><path d="M50 34l-2 6-6-2"/></svg>
  <strong>Bitte quer halten</strong>
  <p>Die Klaviatur braucht die volle Breite. Dreh dein Handy ins Querformat.</p>
</div>

const BUILD='__BUILD__';

  const m=/const BUILD='([^']+)'/.exec(t);
  if(m&&m[1]!==BUILD&&!sessionStorage.getItem('tt-reload-'+m[1])){
    try{sessionStorage.setItem('tt-reload-'+m[1],'1')}catch(e){}
    location.replace(location.pathname+'?v='+m[1]);
  }
}).catch(()=>{});

// ---------- Noten ----------
// Notennamen: deutsch (H, B = B♭), international (B, A♯) oder Solfège
const NAME_SETS={
  de:['C','C♯','D','D♯','E','F','F♯','G','G♯','A','B','H'],
  en:['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],
  solf:['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si']};
let namesMode='de',NAMES=NAME_SETS.de;
const noteName=m=>NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
const isBlack=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
function toMidi(s){
  const r=/^([A-G])([#b]?)(-?\d)$/.exec(s);if(!r)throw new Error('Note? '+s);
  const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[r[1]]+(r[2]==='#'?1:r[2]==='b'?-1:0);
  return 12*(+r[3]+1)+pc;
}
// Stimme: "C4/1 D4+F4/.5 r/1"  (r = Pause, + = Akkord, Länge in Vierteln)
function parseVoice(str,hand){
  let b=0;const out=[];
  for(const tok of str.trim().split(/\s+/)){
    const [p,l]=tok.split('/');const len=+l;
    if(p!=='r')p.split('+').forEach(n=>out.push({m:toMidi(n),s:b,l:len,hand}));
    b+=len;
  }
  return out;
}

function prepSong(s){
  if(!s.notes)s.notes=s.v.flatMap(([h,str])=>parseVoice(str,h));
  s.notes.sort((a,b)=>a.s-b.s||a.m-b.m);
  s.two=new Set(s.notes.map(n=>n.hand)).size>1;

function loadSong(s){
  song=s;notes=s.notes;store('tt-song',s.id);

  notes.forEach((n,i)=>{const k=Math.round(n.s*1000);if(!map.has(k))map.set(k,{s:n.s,idx:[]});map.get(k).idx.push(i)});

function restart(){stepIdx=0;pos=0;found=new Set();doneShown=false;$('done').hidden=true;startTime=performance.now();armed=false;updateWant()}

function layoutKeys(){
  const W=cv.clientWidth||800;keyGeo={};
  const whites=[];for(let m=kbLo;m<=kbHi;m++)if(!isBlack(m))whites.push(m);
  whiteW=W/whites.length;
  whites.forEach((m,i)=>keyGeo[m]={x:i*whiteW,w:whiteW,black:false});
  for(let m=kbLo;m<=kbHi;m++)if(isBlack(m)){

}

    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

  let rms=0;for(let i=0;i<timeBuf.length;i++)rms+=timeBuf[i]*timeBuf[i];rms=Math.sqrt(rms/timeBuf.length);
  $('lvl').firstElementChild.style.width=Math.min(100,rms*800)+'%';
  const now=performance.now();
  const recentMin=rmsHist.length?Math.min(...rmsHist):0;
  if(rms>GATE*1.5&&rms>recentMin*1.6&&now-lastHitAt>120){armed=true;armedAt=now}
  rmsHist.push(rms);if(rmsHist.length>10)rmsHist.shift();

  showHeard(strongestNote(mag,binHz,floor));

  if(now-armedAt>700){armed=false;return}
  const strict=$('strict').checked;
  const exp=steps[stepIdx].idx.filter(i=>!found.has(i));
  const all=steps[stepIdx].idx.map(i=>notes[i].m);
  for(const i of exp){
    const e=notes[i].m,others=all.filter(x=>x!==e);

  const d=new Uint8Array(buf),dv=new DataView(buf);let e=d.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('Die .mxl-Datei ist beschädigt.');
  const n=dv.getUint16(e+10,true);let cd=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    const comp=dv.getUint16(cd+10,true),cs=dv.getUint32(cd+20,true),nl=dv.getUint16(cd+28,true),el=dv.getUint16(cd+30,true),cl=dv.getUint16(cd+32,true),lo=dv.getUint32(cd+42,true);
    const name=new TextDecoder().decode(d.subarray(cd+46,cd+46+nl));
    const off=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    files[name]={comp,data:d.subarray(off,off+cs)};cd+=46+nl+el+cl;
  }
  return files;
}
async function inflate(f){
  if(f.comp===0)return f.data;
  if(typeof DecompressionStream==='undefined')throw new Error('Dein Browser kann .mxl nicht entpacken. Lade bei MuseScore „MIDI“ oder unkomprimiertes MusicXML herunter.');
  const st=new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function mxlToText(buf){
  const files=await unzip(buf),td=new TextDecoder();let root=null;
  if(files['META-INF/container.xml']){const c=td.decode(await inflate(files['META-INF/container.xml']));const m=/full-path="([^"]+)"/.exec(c);if(m)root=m[1]}
  if(!root||!files[root])root=Object.keys(files).find(k=>/\.(musicxml|xml)$/i.test(k)&&!k.startsWith('META-INF'));
  if(!root)throw new Error('In der .mxl-Datei wurde keine Partitur gefunden.');
  return td.decode(await inflate(files[root]));
}
function parseMusicXML(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Die MusicXML-Datei konnte nicht gelesen werden.');
  const q=sel=>doc.querySelector(sel)?.textContent?.trim()||'';
  const title=q('work-title')||q('movement-title');
  const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};let tempo=0,bar=0;const out=[];
  [...doc.getElementsByTagName('part')].forEach((part,pi)=>{
    let divs=1,time=0,last=0;const ties=new Map();
    for(const meas of part.children){if(meas.tagName!=='measure')continue;
      for(const el of meas.children){
        const tag=el.tagName,dur=()=>+(el.getElementsByTagName('duration')[0]?.textContent||0);
        if(tag==='attributes'){const dvs=el.getElementsByTagName('divisions')[0];if(dvs)divs=+dvs.textContent||1;
          const bt=el.getElementsByTagName('beats')[0],by=el.getElementsByTagName('beat-type')[0];if(bt&&by&&!bar)bar=+bt.textContent*4/+by.textContent}
        else if(tag==='sound'||tag==='direction'){const snd=tag==='sound'?el:el.getElementsByTagName('sound')[0];if(snd&&snd.getAttribute('tempo')&&!tempo)tempo=+snd.getAttribute('tempo')}
        else if(tag==='backup')time-=dur();
        else if(tag==='forward')time+=dur();
        else if(tag==='note'){
          if(el.getElementsByTagName('grace').length)continue;
          const isChord=el.getElementsByTagName('chord').length>0,dd=dur();
          const start=isChord?last:time;if(!isChord){last=time;time+=dd}
          const pitch=el.getElementsByTagName('pitch')[0];if(!pitch)continue;
          const g=t=>pitch.getElementsByTagName(t)[0]?.textContent;
          const m=12*(+g('octave')+1)+PC[g('step')]+Math.round(+(g('alter')||0));
          const staff=+(el.getElementsByTagName('staff')[0]?.textContent||1);
          const tt=[...el.getElementsByTagName('tie')].map(x=>x.getAttribute('type')),key=pi+'|'+staff+'|'+m;
          if(tt.includes('stop')&&ties.has(key)){const n=ties.get(key);n.l+=dd/divs;if(!tt.includes('start'))ties.delete(key);continue}
          const n={m,s:start/divs,l:dd/divs,g:pi*16+staff,staff};out.push(n);
          if(tt.includes('start'))ties.set(key,n);
        }
      }
    }
  });
  return {notes:out,tempo,bar,title};
}
// Gelesene Noten in ein spielbares Lied umwandeln
function buildImported(r,fileName){
  let ns=r.notes.filter(n=>n.m>=21&&n.m<=108&&n.l>0);
  if(!ns.length)throw new Error('In der Datei wurden keine Noten gefunden.');
  const qz=x=>Math.round(x*24)/24;
  ns.forEach(n=>{n.s=qz(n.s);n.l=Math.max(1/8,qz(n.l))});
  // Hände: Notensystem 2 = links; sonst die Spur mit höheren Tönen rechts; sonst Teilung am mittleren C
  const hasStaff2=ns.some(n=>n.staff===2);
  const grp=[...new Set(ns.map(n=>n.g))];
  if(hasStaff2)ns.forEach(n=>n.hand=n.staff===2?'l':'r');
  else if(grp.length>=2){
    const mean=g=>{const a=ns.filter(n=>n.g===g);return a.reduce((x,n)=>x+n.m,0)/a.length};
    const top=grp.reduce((a,b)=>mean(a)>=mean(b)?a:b);ns.forEach(n=>n.hand=n.g===top?'r':'l');
  }else ns.forEach(n=>n.hand=n.m>=60?'r':'l');
  // doppelte Töne entfernen, am Anfang Pausen abschneiden
  const seen=new Set();ns=ns.filter(n=>{const k=n.m+'@'+n.s;if(seen.has(k))return false;seen.add(k);return true});
  const first=Math.min(...ns.map(n=>n.s));ns.forEach(n=>n.s-=first);
  const bar=r.bar>0?r.bar:4,pick=((-first)%bar+bar)%bar;
  const total=Math.max(...ns.map(n=>n.s+n.l)),dens=ns.length/Math.max(1,total);
  const two=new Set(ns.map(n=>n.hand)).size>1;
  const lv=(two&&dens>2.2)||dens>3?3:(two||dens>1.3?2:1);
  const t=(r.title||fileName.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ')).slice(0,60)||'Eigenes Lied';
  return prepSong({id:'c'+Date.now().toString(36),t,c:'Eigenes Lied',lv,bpm:Math.round(r.tempo>20&&r.tempo<300?r.tempo:100),bar,pick,
    notes:ns.map(n=>({m:n.m,s:n.s,l:n.l,hand:n.hand}))});
}
async function importFile(file){
  const note=$('menuNote');note.style.color='';note.textContent='Lese „'+file.name+'“ …';
  try{
    const buf=await file.arrayBuffer(),u=new Uint8Array(buf);let r;
    if(u[0]===0x4D&&u[1]===0x54&&u[2]===0x68&&u[3]===0x64)r=parseMidi(buf);
    else if(u[0]===0x50&&u[1]===0x4B)r=parseMusicXML(await mxlToText(buf));
    else{const txt=new TextDecoder().decode(u);
      if(!/^\s*(\ufeff)?\s*</.test(txt))throw new Error('Dateiformat nicht erkannt. Bitte eine MIDI-Datei (.mid) oder MusicXML (.musicxml, .mxl) wählen.');
      r=parseMusicXML(txt)}
    const song=buildImported(r,file.name);
    CUSTOM.push(song);
    if(!saveCustom()){CUSTOM.pop();throw new Error('Nicht genug Speicherplatz im Browser, um das Lied zu sichern.')}
    note.style.color='var(--ok)';note.textContent=`„${song.t}“ hinzugefügt: ${song.notes.length} Töne, ${song.two?'2 Hände':'1 Hand'}.`;
    buildMenu();
  }catch(e){note.style.color='';note.textContent='Import fehlgeschlagen: '+(e.message||e)}
}
$('importFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f)};

function songCard(s,custom){
  const b=document.createElement('button');b.className='song'+(custom?' custom':'');b.type='button';
  const left=(s.lo-21)/88*100,width=(s.hi-s.lo+1)/88*100,best=bestOf(s.id);
  b.innerHTML=`<div class="top"><div><b></b><small></small></div>${best?`<span class="badge">✓ ${best} s</span>`:''}</div>
    <div class="range" title="Tonumfang"><span style="left:${left}%;width:${width}%"></span></div>
    <div class="meta"><span class="hands">${s.two?'<i class="l"></i><i></i> 2 Hände':'<i></i> 1 Hand'}</span><span>${noteName(s.lo)}–${noteName(s.hi)}</span></div>`;
  b.querySelector('b').textContent=s.t;b.querySelector('small').textContent=custom?`${s.c} · ${LV[s.lv].toLowerCase()} · ${s.notes.length} Töne`:s.c;
  b.onclick=()=>chooseSong(s);
  if(custom){
    const del=document.createElement('span');del.className='del';del.textContent='Löschen';del.setAttribute('role','button');del.tabIndex=0;
    let timer=null;
    const act=ev=>{ev.stopPropagation();
      if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Wirklich?';timer=setTimeout(()=>{del.classList.remove('armed');del.textContent='Löschen'},3000);return}
      clearTimeout(timer);CUSTOM=CUSTOM.filter(c=>c.id!==s.id);saveCustom();buildMenu()};
    del.onclick=act;del.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();act(ev)}};
    b.append(del);
  }
  return b;
}
function buildMenu(){
  const list=$('list');list.textContent='';
  // Eigene Lieder
  const sec=document.createElement('div');sec.className='sec';
  sec.innerHTML=`<h2>Eigene Lieder</h2><span>${CUSTOM.length?CUSTOM.length+' Stücke':'MIDI oder MusicXML'}</span>`;
  const grid=document.createElement('div');grid.className='grid';
  const add=document.createElement('button');add.className='song add';add.type='button';
  add.innerHTML='<span class="plus">＋</span><b>Lied importieren</b><small>MIDI- oder MusicXML-Datei öffnen, z. B. von MuseScore heruntergeladen</small>';
  add.onclick=()=>$('importFile').click();
  grid.append(add,...CUSTOM.map(s=>songCard(s,true)));
  list.append(sec,grid);
  for(const lv of [1,2,3]){
    const songs=SONGS.filter(s=>s.lv===lv);if(!songs.length)continue;
    const sec=document.createElement('div');sec.className='sec';
    sec.innerHTML=`<span class="dots l${lv}"><i></i><i></i><i></i></span><h2>${LV[lv]}</h2><span>${songs.length} Stücke</span>`;
    const grid=document.createElement('div');grid.className='grid';
    songs.forEach(s=>grid.append(songCard(s,false)));
    list.append(sec,grid);
  }
}
loadCustom();
buildMenu();
function setNames(mode){
  if(!NAME_SETS[mode])mode='de';namesMode=mode;NAMES=NAME_SETS[mode];store('tt-names',mode);
  document.querySelectorAll('[data-names]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.names===mode));
  buildMenu();heardShown=null;
}
document.querySelectorAll('[data-names]').forEach(b=>b.onclick=()=>setNames(b.dataset.names));
setNames(load('tt-names')||'de');
async function goLandscape(){
  try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}
  try{await screen.orientation?.lock?.('landscape')}catch(e){}
  try{await navigator.wakeLock?.request('screen')}catch(e){}
}
async function chooseSong(s){
  noMic=$('noMic').checked;
  goLandscape();
  if(!noMic){const ok=await startMic();
    if(!ok){$('menuNote').textContent='Kein Mikrofon-Zugriff. Erlaube das Mikrofon in den Browser-Einstellungen oder wähle „Ohne Mikrofon“.';return}}
  $('menuNote').textContent='';
  $('menu').hidden=true;document.body.classList.add('playing');started=true;
  resize();loadSong(s);
}
function openMenu(){buildMenu();$('menu').hidden=false;$('menu').scrollTop=0;document.body.classList.remove('playing');started=false}
$('openMenu').onclick=openMenu;$('toMenu').onclick=openMenu;

// Startzustand: Menü offen, im Hintergrund das zuletzt gespielte Lied
resize();loadSong(allSongs().find(s=>s.id===load('tt-song'))||SONGS[0]);
requestAnimationFrame(draw);
</script>
