<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16131f">
<title>Ton-Tiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Querformat — schmale Leiste oben, Notenbahn, Klaviatur am unteren Rand; Liedmenü als Vollbild-Ebene */
:root{
  --bg:#16131f; --panel:#211c2e; --line:#2e2840; --fg:#f2eff8; --muted:#958da8;
  --rh:#8d72ff; --lh:#2fc4b2; --ok:#5ee39a; --warn:#ff7a8a;
  --white:#f6f3fb; --white-edge:#c9c2d6; --black:#1b1726;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:600 .85rem var(--display);color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:6px 11px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--rh);outline-offset:2px}
button.primary{background:var(--rh);border-color:transparent;color:#fff}

#bar{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,#221c33,#18142400)}
#songTitle{flex:1 1 auto;min-width:0;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#heard{flex:none;width:7.5em;font:600 1rem/1 var(--mono);color:var(--ok);white-space:nowrap;overflow:hidden;text-align:right}
#want{flex:none;width:4.8em;font:500 .8rem var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#lvl{flex:none;width:34px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#lvl i{display:block;height:100%;width:0;background:var(--lh)}
#stage{position:relative;flex:1 1 auto;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* Liedmenü */
#menu{position:fixed;inset:0;z-index:5;overflow-y:auto;
  background:radial-gradient(1200px 500px at 0% -10%,#3a2a7a55,transparent 60%),radial-gradient(900px 500px at 110% 0%,#1d6b6233,transparent 60%),var(--bg);
  padding:max(18px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto}
#menu header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.logo{display:flex;gap:2px;align-items:flex-end;height:34px}
.logo i{display:block;width:9px;border-radius:2px 2px 3px 3px;background:var(--white)}
.logo i:nth-child(1){height:34px}.logo i:nth-child(2){height:22px;background:var(--rh)}.logo i:nth-child(3){height:34px}.logo i:nth-child(4){height:26px;background:var(--lh)}.logo i:nth-child(5){height:34px}
#menu h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1}
#menu header p{margin:0;color:var(--muted);font-size:.92rem;flex:1 1 28ch;line-height:1.4}
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.chip{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--fg);background:#ffffff0a;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip input{accent-color:var(--rh);margin:0}
.sec{display:flex;align-items:baseline;gap:10px;margin:20px 0 10px}
.sec h2{margin:0;font-size:1rem;font-weight:700;letter-spacing:.01em}
.sec span{font:500 .75rem var(--mono);color:var(--muted)}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots.l1 i:nth-child(-n+1),.dots.l2 i:nth-child(-n+2),.dots.l3 i:nth-child(-n+3){background:var(--lvc)}
.dots.l1{--lvc:var(--ok)}.dots.l2{--lvc:#ffc65c}.dots.l3{--lvc:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.song{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-width:0;
  background:linear-gradient(165deg,#2a2340,#1c1829);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px 12px;display:grid;grid-template-rows:1fr auto auto;gap:9px;transition:transform .15s,border-color .15s,box-shadow .15s}
.song:hover{transform:translateY(-2px);border-color:#5b4aa8;box-shadow:0 10px 24px -12px #000}
.song:focus-visible{outline:2px solid var(--rh);outline-offset:2px}
.song .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.song b{font-size:1.02rem;font-weight:700;line-height:1.2}
.song small{color:var(--muted);font-size:.8rem;display:block;margin-top:3px}
.badge{flex:none;font:600 .68rem var(--mono);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-radius:999px;padding:2px 7px;white-space:nowrap}
.range{position:relative;height:14px;border-radius:4px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#ffffff16 0 calc(100%/52 - 1px),transparent calc(100%/52 - 1px) calc(100%/52))}
.range span{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--lh),var(--rh));opacity:.85}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 .72rem var(--mono);color:var(--muted)}
.hands{display:inline-flex;gap:5px;align-items:center}
.hands i{width:8px;height:8px;border-radius:2px;background:var(--rh)}.hands i.l{background:var(--lh)}
#menuNote{color:var(--warn);font-size:.85rem;margin-top:10px}
#menuNote:empty{display:none}

#done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px)}
.donecard{display:grid;justify-items:center;gap:10px;padding:22px 28px;border-radius:18px;
  background:linear-gradient(165deg,#2a2340,#1c1829);border:1px solid var(--line);box-shadow:0 20px 50px -20px #000}
.donecard .tick{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-size:1.5rem}
.donecard strong{font-size:1.6rem}
.donecard span{color:var(--muted);font-family:var(--mono);font-size:.85rem}
.donecard div{display:flex;gap:8px}
#prog{flex:none;height:3px;background:#ffffff0d}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lh),var(--rh));transition:width .25s}

#rotate{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#rotate svg{width:64px;height:64px}
#rotate p{margin:0;color:var(--muted);max-width:28ch}
@media (orientation:portrait){body.playing #rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#lvl i,#prog i,.song{transition:none}}
</style>
</head>
<body>
<div id="bar">
  <button id="openMenu" aria-label="Liedauswahl öffnen">☰ Lieder</button>
  <div id="songTitle">–</div>
  <div id="heard" aria-live="off">–</div>
  <div id="lvl" title="Mikrofon-Pegel"><i></i></div>
  <div id="want">0/0</div>

    <div class="donecard">

      <span id="doneStats"></span>
      <div><button class="primary" id="again">Nochmal</button><button id="toMenu">Anderes Lied</button></div>
    </div>
  </div>
</div>

<div id="menu"><div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <div id="list"></div>
</div></div>

<div id="rotate">
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="6" width="24" height="40" rx="4"/><path d="M8 50h36a4 4 0 0 0 4-4"/><path d="M50 34l-2 6-6-2"/></svg>
  <strong>Bitte quer halten</strong>
  <p>Die Klaviatur braucht die volle Breite. Dreh dein Handy ins Querformat.</p>
</div>

<script>

const BUILD='1792136478';
fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
  const m=/const BUILD='([^']+)'/.exec(t);
  if(m&&m[1]!==BUILD&&!sessionStorage.getItem('tt-reload-'+m[1])){
    try{sessionStorage.setItem('tt-reload-'+m[1],'1')}catch(e){}
    location.replace(location.pathname+'?v='+m[1]);
  }
}).catch(()=>{});
// Tonprüfung — Tonprüfung über das Spektrum (wird in index.html eingebettet)
const noteFreq=m=>440*Math.pow(2,(m-69)/12);
const SEMI=Math.pow(2,1/12);
function peakAt(mag,binHz,f){
  const nb=mag.length,b=f/binHz,b0=Math.max(1,Math.floor(b*0.988)),b1=Math.min(nb-1,Math.ceil(b*1.012));
  let m=0;for(let i=b0;i<=b1;i++)if(mag[i]>m)m=mag[i];return m;
}
// Wie deutlich ragt bei Frequenz f ein Ton heraus (verglichen mit einem Halbton darüber/darunter)?
function toneRatio(mag,binHz,f){
  const d=Math.max(f*(SEMI-1),4.5*binHz); // Abstand mind. so groß wie das Fenster breit ist
  return peakAt(mag,binHz,f)/(Math.max(peakAt(mag,binHz,f-d),peakAt(mag,binHz,f+d))+1e-9);
}
function sharedWith(fh,others){
  return others.some(p=>{const fp=noteFreq(p),k=Math.round(fh/fp);return k>=1&&Math.abs(fh-k*fp)<0.012*fh});
}
// Klingt Ton e? `others` = andere Töne, die gerade gleichzeitig erwartet werden.
// Erwartete Stärke an Frequenz fh, die von anderen (gleichzeitig erwarteten) Tönen stammt
function sharedLevel(fh,others,mag,binHz){
  let lv=-1;
  for(const p of others){const fp=noteFreq(p),k=Math.round(fh/fp);
    if(k>=1&&Math.abs(fh-k*fp)<0.012*fh){
      const b=peakAt(mag,binHz,fp*(k+1));
      const est=k>1?Math.min(peakAt(mag,binHz,fp*(k-1)),b):b;
      lv=Math.max(lv,est)}}
  return lv; // -1 = nicht geteilt
}
function hasNote(e,others,mag,binHz,floor){
  const f0=noteFreq(e),H=[];let considered=0,passes=0;
  for(let h=1;h<=6;h++){
    const fh=f0*h;if(fh>5000)break;
    const pk=peakAt(mag,binHz,fh),sl=sharedLevel(fh,others,mag,binHz);
    let ok;
    if(sl<0){ok=pk>floor&&toneRatio(mag,binHz,fh)>=2.5;considered++;if(ok)passes++}
    else{ok=pk>floor&&pk>2*sl;if(ok)passes++}
    H[h]=ok;
  }
  // Grundton muss belegt sein (tiefe Töne: 3. Oberton reicht, dazu der 2.)
  const fundOK=e>=48?H[1]:((H[1]||H[3])&&(H[2]||H[1]));
  if(!fundOK||passes<Math.max(1,Math.ceil(0.5*considered)))return false;
  // Eine Oktave tiefer gespielt? Dann gäbe es Töne bei f/2 und 1,5·f
  if(!others.some(p=>p===e-12)){
    const half=f0/2,onehalf=f0*1.5;
    const sub=x=>peakAt(mag,binHz,x)>floor&&toneRatio(mag,binHz,x)>=2.5&&sharedLevel(x,others,mag,binHz)<0;
    if(sub(onehalf)&&(half<55||sub(half)))return false;
  }
  return true;
}
// Stärkster einzelner Ton (für die Anzeige)
function strongestNote(mag,binHz,floor){
  let bestN=-1,bestV=0;
  for(let n=36;n<=96;n++){
    const f0=noteFreq(n);let v=0,ok=0;
    for(let h=1;h<=4;h++){const fh=f0*h;const pk=peakAt(mag,binHz,fh);
      if(toneRatio(mag,binHz,fh)>=2.5&&pk>floor){v+=pk;if(h%2)ok++}}
    if(ok&&v>bestV){bestV=v;bestN=n}
  }
  // tiefste Oktave wählen, die noch selbst (ungerade Obertöne) belegt ist
  return bestN;
}


// ---------- Noten ----------
const NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','B','H'];
const noteName=m=>NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
const isBlack=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
function toMidi(s){
  const r=/^([A-G])([#b]?)(-?\d)$/.exec(s);if(!r)throw new Error('Note? '+s);
  const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[r[1]]+(r[2]==='#'?1:r[2]==='b'?-1:0);
  return 12*(+r[3]+1)+pc;
}
// Stimme: "C4/1 D4+F4/.5 r/1"  (r = Pause, + = Akkord, Länge in Vierteln)
function parseVoice(str,hand){
  let b=0;const out=[];
  for(const tok of str.trim().split(/\s+/)){
    const [p,l]=tok.split('/');const len=+l;
    if(p!=='r')p.split('+').forEach(n=>out.push({m:toMidi(n),s:b,l:len,hand}));
    b+=len;
  }
  return out;
}

// ---------- Zustand ----------
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let song=null,notes=[],steps=[],totalBeats=0,stepIdx=0,pos=0,found=new Set(),
    started=false,startTime=0,doneShown=false,lastFrame=0,wrongFlash=0;
let kbLo=48,kbHi=84,keyGeo={},whiteW=20;

function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
$('strict').checked=load('tt-strict')==='1';
$('strict').onchange=e=>store('tt-strict',e.target.checked?'1':'0');

function loadSong(s){
  song=s;notes=s.notes;store('tt-song',s.id);
  const map=new Map();
  notes.forEach((n,i)=>{const k=Math.round(n.s*1000);if(!map.has(k))map.set(k,{s:n.s,idx:[]});map.get(k).idx.push(i)});
  steps=[...map.values()].sort((a,b)=>a.s-b.s);
  totalBeats=Math.max(...notes.map(n=>n.s+n.l));
  // Klaviatur: Liedumfang auf ganze Oktaven erweitern, mindestens zwei Oktaven
  let lo=Math.floor(s.lo/12)*12,hi=Math.ceil((s.hi+1)/12)*12;
  while(hi-lo<24){if(lo>36)lo-=12;else hi+=12}
  kbLo=lo;kbHi=hi;layoutKeys();
  $('songTitle').textContent=s.t;
  restart();
}
function restart(){stepIdx=0;pos=0;found=new Set();doneShown=false;$('done').hidden=true;startTime=performance.now();armed=false;updateWant()}
function updateWant(){$('want').textContent=`${Math.min(stepIdx,steps.length)}/${steps.length}`;$('prog').firstElementChild.style.width=(steps.length?Math.min(stepIdx,steps.length)/steps.length*100:0)+'%'}

// ---------- Klaviatur-Geometrie ----------
function layoutKeys(){
  const W=cv.clientWidth||800;keyGeo={};
  const whites=[];for(let m=kbLo;m<=kbHi;m++)if(!isBlack(m))whites.push(m);
  whiteW=W/whites.length;
  whites.forEach((m,i)=>keyGeo[m]={x:i*whiteW,w:whiteW,black:false});
  for(let m=kbLo;m<=kbHi;m++)if(isBlack(m)){
    const left=keyGeo[m-1];if(!left)continue;const bw=whiteW*0.62;
    keyGeo[m]={x:left.x+whiteW-bw/2,w:bw,black:true};
  }
}

// ---------- Ablauf ----------
function currentExpected(){return stepIdx<steps.length?steps[stepIdx].idx.map(i=>notes[i].m):[]}
function markFound(m){ // m = MIDI eines erkannten Tons
  if(stepIdx>=steps.length)return;
  const strict=$('strict').checked;
  for(const i of steps[stepIdx].idx){
    if(found.has(i))continue;
    const e=notes[i].m;
    if(strict?m===e:((m-e)%12+12)%12===0){found.add(i)}
  }
  checkStep();
}
function checkStep(){
  if(stepIdx>=steps.length)return;
  if(steps[stepIdx].idx.every(i=>found.has(i))){
    for(const i of steps[stepIdx].idx){const g=keyGeo[notes[i].m];if(g)burst(g.x+g.w/2,kbTop,notes[i].hand==='l'?C['--lh']:C['--rh'],10)}
    stepIdx++;found=new Set();armed=false;lastHitAt=performance.now();updateWant();
    if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  }
}

// ---------- Mikrofon ----------
let audioCtx=null,analyser=null,timeBuf,freqDb,mag,binHz=6,armed=false,armedAt=0,lastHitAt=0,rmsHist=[],micOn=false;
const GATE=0.008;
async function startMic(){
  if(micOn)return true;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=0;
    analyser.minDecibels=-120;analyser.maxDecibels=0;
    src.connect(analyser);
    timeBuf=new Float32Array(2048);freqDb=new Float32Array(analyser.frequencyBinCount);mag=new Float32Array(analyser.frequencyBinCount);
    binHz=audioCtx.sampleRate/analyser.fftSize;micOn=true;return true;
  }catch(e){return false}
}
function listen(){
  if(!analyser)return;
  analyser.getFloatTimeDomainData(timeBuf);
  let rms=0;for(let i=0;i<timeBuf.length;i++)rms+=timeBuf[i]*timeBuf[i];rms=Math.sqrt(rms/timeBuf.length);
  $('lvl').firstElementChild.style.width=Math.min(100,rms*800)+'%';
  const now=performance.now();
  const recentMin=rmsHist.length?Math.min(...rmsHist):0;
  if(rms>GATE*1.5&&rms>recentMin*1.6&&now-lastHitAt>120){armed=true;armedAt=now}
  rmsHist.push(rms);if(rmsHist.length>10)rmsHist.shift();
  if(rms<GATE){showHeard(-1);return}
  analyser.getFloatFrequencyData(freqDb);
  for(let i=0;i<mag.length;i++)mag[i]=Math.pow(10,freqDb[i]/20);
  // Rauschboden = Median ×4
  const sorted=Float32Array.from(mag.subarray(0,1200)).sort();const floor=sorted[600]*4;
  showHeard(strongestNote(mag,binHz,floor));
  if(!armed||stepIdx>=steps.length)return;
  if(now-armedAt>700){armed=false;return}
  const strict=$('strict').checked;
  const exp=steps[stepIdx].idx.filter(i=>!found.has(i));
  const all=steps[stepIdx].idx.map(i=>notes[i].m);
  for(const i of exp){
    const e=notes[i].m,others=all.filter(x=>x!==e);
    const cands=strict?[e]:[e-24,e-12,e,e+12,e+24].filter(x=>x>=28&&x<=100);
    if(cands.some(c=>hasNote(c,others,mag,binHz,floor)))found.add(i);
  }
  checkStep();
}
let heardShown=null;
function showHeard(m){if(m===heardShown)return;heardShown=m;$('heard').textContent=m<0?'–':noteName(m)}

// ---------- Zeichnen ----------
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
const C={};['--bg','--panel','--line','--fg','--muted','--rh','--lh','--ok','--warn','--white','--white-edge','--black'].forEach(k=>C[k]=css(k));
function resize(){const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);layoutKeys()}
addEventListener('resize',resize);

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
let lastPpb=60,kbTop=0;
function draw(t){
  requestAnimationFrame(draw);
  listen();
  const W=cv.clientWidth,H=cv.clientHeight;if(!W||!song)return;
  const kbH=Math.min(H*0.22,Math.max(46,whiteW*3.4)),hitY=H-kbH;kbTop=hitY;
  const ppb=Math.max(34,hitY/5.5);lastPpb=ppb;
  const dt=Math.min(.05,(t-(lastFrame||t))/1000);lastFrame=t;
  const limit=stepIdx<steps.length?steps[stepIdx].s:totalBeats,gap=limit-pos;
  if(!dragging){
    if(gap>0)pos=Math.min(limit,pos+Math.max(song.bpm/60,gap*5)*dt);
    else if(gap<0)pos=Math.max(limit,pos+gap*Math.min(1,dt*14));
  }
  if(!doneShown&&stepIdx>=steps.length&&pos>=totalBeats-1e-6){doneShown=true;
    const secs=Math.max(1,Math.round((performance.now()-startTime)/1000)),prev=bestOf(song.id);
    if(!prev||secs<prev)store('tt-best-'+song.id,secs);
    $('doneStats').textContent=`${notes.length} Töne · ${secs} s`+(prev&&secs<prev?' · neue Bestzeit':prev?` · Bestzeit ${prev} s`:'');
    $('done').hidden=false;burst(cv.clientWidth/2,kbTop,C['--ok'],40)}

  // Hintergrund
  const bgG=ctx.createLinearGradient(0,0,0,hitY);bgG.addColorStop(0,'#0e0b16');bgG.addColorStop(1,'#1d1730');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,hitY);
  for(let m=kbLo;m<=kbHi;m++){const g=keyGeo[m];if(!g)continue;
    if(g.black){ctx.fillStyle='#00000038';ctx.fillRect(g.x,0,g.w,hitY)}
    if(m%12===0){ctx.fillStyle='#ffffff10';ctx.fillRect(g.x,0,1,hitY)}}

  const beatsPerBar=song.bar||4,pick=song.pick||0;
  for(let b=Math.ceil(pos);b<=pos+hitY/ppb+1;b++){
    const y=hitY-(b-pos)*ppb,isBar=((b-pick)%beatsPerBar+beatsPerBar)%beatsPerBar===0;
    ctx.fillStyle=isBar?'#ffffff1c':'#ffffff09';ctx.fillRect(0,y,W,1)}

  const expIdx=stepIdx<steps.length?new Set(steps[stepIdx].idx):new Set();
  const pulse=.5+.5*Math.sin(t/190);
  // Lichtkegel über den erwarteten Tasten
  if(stepIdx<steps.length)for(const i of steps[stepIdx].idx){const n=notes[i],g=keyGeo[n.m];if(!g)continue;
    const col=found.has(i)?C['--ok']:(n.hand==='l'?C['--lh']:C['--rh']);
    const lg=ctx.createLinearGradient(0,hitY-hitY*.6,0,hitY);lg.addColorStop(0,col+'00');lg.addColorStop(1,col+(found.has(i)?'55':'3a'));
    ctx.fillStyle=lg;ctx.fillRect(g.x,hitY-hitY*.6,g.w,hitY*.6)}

  // Noten
  const sounding=new Map();
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,hitY);ctx.clip();
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const pass of [false,true])for(let i=0;i<notes.length;i++){
    const n=notes[i],g=keyGeo[n.m];if(!g||g.black!==pass)continue;
    const bottom=hitY-(n.s-pos)*ppb,h=n.l*ppb,top=bottom-h;
    if(bottom<-2)continue;if(top>hitY)continue;
    const done=n.s<limit-1e-6||found.has(i),waiting=expIdx.has(i)&&!found.has(i);
    const col=n.hand==='l'?C['--lh']:C['--rh'],hi=n.hand==='l'?'#7ef0e1':'#c3b4ff';
    const pad=g.black?1.5:2.5,x=g.x+pad,w=g.w-pad*2,y=top+2,hh=Math.max(4,h-4),rad=Math.min(8,w/2.6);
    ctx.globalAlpha=done?.32:1;
    if(waiting){ctx.shadowColor=col;ctx.shadowBlur=16+8*pulse}
    const tg=ctx.createLinearGradient(0,y,0,y+hh);tg.addColorStop(0,hi);tg.addColorStop(.35,col);tg.addColorStop(1,col);
    ctx.fillStyle=tg;rr(x,y,w,hh,rad);ctx.fill();ctx.shadowBlur=0;
    if(g.black){ctx.fillStyle='#0000004d';rr(x,y,w,hh,rad);ctx.fill()}
    ctx.fillStyle='#ffffff55';rr(x+2,y+1.5,w-4,Math.min(3,hh/4),1.5);ctx.fill();
    ctx.globalAlpha=1;
    if(waiting){ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.globalAlpha=.45+.45*pulse;rr(x-.5,y-.5,w+1,hh+1,rad);ctx.stroke();ctx.globalAlpha=1}
    if(found.has(i)){ctx.fillStyle=C['--ok'];rr(x,y,w,hh,rad);ctx.globalAlpha=.55;ctx.fill();ctx.globalAlpha=1}
    if(w>=13&&hh>=16){ctx.fillStyle=done?'#ffffffaa':'#ffffff';
      ctx.font=`700 ${Math.min(12,w*.52)|0}px "IBM Plex Mono",monospace`;
      ctx.fillText(NAMES[n.m%12],g.x+g.w/2,Math.max(y+10,Math.min(y+hh-10,hitY-12)))}
    if(n.s<=pos+1e-6&&pos<n.s+n.l&&n.s<limit-1e-6)sounding.set(n.m,n.hand);
  }
  ctx.restore();

  // Klaviatur
  const kg=ctx.createLinearGradient(0,hitY,0,H);kg.addColorStop(0,'#0b0910');kg.addColorStop(1,'#16121f');
  ctx.fillStyle=kg;ctx.fillRect(0,hitY,W,kbH);
  const expM=new Map();if(stepIdx<steps.length)steps[stepIdx].idx.forEach(i=>expM.set(notes[i].m,found.has(i)?'ok':notes[i].hand));
  for(let m=kbLo;m<=kbHi;m++){const g=keyGeo[m];if(!g||g.black)continue;
    const wg=ctx.createLinearGradient(0,hitY,0,H);wg.addColorStop(0,'#d9d3e4');wg.addColorStop(.12,'#fbfaff');wg.addColorStop(1,'#e9e4f2');
    ctx.fillStyle=wg;rr(g.x+.8,hitY+2,g.w-1.6,kbH-4,5);ctx.fill();
    keyLight(m,g,hitY+2,kbH-4,expM,sounding,pulse);
    if(m%12===0&&g.w>=14){ctx.fillStyle='#8a83a0';ctx.font=`600 ${Math.min(11,g.w*.42)|0}px "IBM Plex Mono",monospace`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(noteName(m),g.x+g.w/2,H-11)}}
  for(let m=kbLo;m<=kbHi;m++){const g=keyGeo[m];if(!g||!g.black)continue;
    const bh=kbH*.6;
    ctx.fillStyle='#00000055';rr(g.x+1,hitY+2,g.w+1.5,bh+2,4);ctx.fill();
    const bg2=ctx.createLinearGradient(0,hitY,0,hitY+bh);bg2.addColorStop(0,'#3a3448');bg2.addColorStop(.85,'#14111c');bg2.addColorStop(1,'#2a2535');
    ctx.fillStyle=bg2;rr(g.x,hitY,g.w,bh,4);ctx.fill();
    keyLight(m,g,hitY,bh,expM,sounding,pulse)}
  // Trefferlinie mit Glanz
  const hl=ctx.createLinearGradient(0,0,W,0);hl.addColorStop(0,C['--lh']);hl.addColorStop(1,C['--rh']);
  ctx.shadowColor=C['--rh'];ctx.shadowBlur=10;ctx.fillStyle=hl;ctx.fillRect(0,hitY-1.5,W,3);ctx.shadowBlur=0;

  // Partikel
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.life-=dt;if(p.life<=0){parts.splice(k,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;
    ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}

}
const parts=[];
function burst(x,y,c,n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let k=0;k<n;k++){const a=-Math.PI*(0.15+0.7*Math.random()),v=90+Math.random()*190;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1.2+Math.random()*2.2,c,life:.5+Math.random()*.4,max:.9})}

}
function keyLight(m,g,y,h,expM,sounding,pulse){

  if(expM.has(m)){const v=expM.get(m);col=v==='ok'?C['--ok']:(v==='l'?C['--lh']:C['--rh']);a=v==='ok'?.9:.45+.4*pulse}
  else if(sounding.has(m)){col=sounding.get(m)==='l'?C['--lh']:C['--rh'];a=.55}
  if(!col)return;
  const gg=ctx.createLinearGradient(0,y,0,y+h);gg.addColorStop(0,col);gg.addColorStop(1,col+'aa');
  ctx.globalAlpha=a;ctx.fillStyle=gg;rr(g.x+(g.black?1:1.8),y+(g.black?1:2),g.w-(g.black?2:3.6),h-(g.black?2:4),4);ctx.fill();ctx.globalAlpha=1;
}

// ---------- Eingaben: Spulen (Notenbereich) und Testtasten (Klaviatur, nur ohne Mikrofon) ----------
let dragging=false,dragY=0,dragPos=0,wheelTimer=null,noMic=false;
function keyAt(x,y){
  if(y<kbTop)return null;const kbH=cv.clientHeight-kbTop;
  if(y<kbTop+kbH*.6)for(let m=kbLo;m<=kbHi;m++){const g=keyGeo[m];if(g&&g.black&&x>=g.x&&x<g.x+g.w)return m}
  for(let m=kbLo;m<=kbHi;m++){const g=keyGeo[m];if(g&&!g.black&&x>=g.x&&x<g.x+g.w)return m}
  return null;
}
function snapToNearest(){
  let best=0,bd=Infinity;steps.forEach((s,i)=>{const d=Math.abs(s.s-pos);if(d<bd){bd=d;best=i}});
  if(pos>=totalBeats-.25)best=steps.length;
  stepIdx=best;found=new Set();doneShown=false;$('done').hidden=true;armed=false;lastHitAt=performance.now();updateWant();
}
cv.addEventListener('pointerdown',e=>{
  if(!started)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const k=keyAt(x,y);
  if(k!=null){if(noMic){markFound(k);showHeard(k)}return}
  dragging=true;dragY=e.clientY;dragPos=pos;cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{if(!dragging)return;pos=Math.max(0,Math.min(totalBeats,dragPos+(e.clientY-dragY)/lastPpb))});
const endDrag=()=>{if(!dragging)return;dragging=false;snapToNearest()};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{if(!started)return;e.preventDefault();dragging=true;
  pos=Math.max(0,Math.min(totalBeats,pos+e.deltaY/lastPpb*.6));
  clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{dragging=false;snapToNearest()},220)},{passive:false});
$('back').onclick=()=>{if(!started)return;stepIdx=Math.max(0,Math.min(stepIdx,steps.length)-1);found=new Set();doneShown=false;$('done').hidden=true;armed=false;lastHitAt=performance.now();updateWant()};
$('restart').onclick=restart;$('again').onclick=restart;

// ---------- Menü ----------
const LV=['','Leicht','Mittel','Schwer'];
function bestOf(id){const v=+load('tt-best-'+id);return v>0?v:0}
function buildMenu(){
  const list=$('list');list.textContent='';
  for(const lv of [1,2,3]){
    const songs=SONGS.filter(s=>s.lv===lv);if(!songs.length)continue;
    const sec=document.createElement('div');sec.className='sec';
    sec.innerHTML=`<span class="dots l${lv}"><i></i><i></i><i></i></span><h2>${LV[lv]}</h2><span>${songs.length} Stücke</span>`;
    const grid=document.createElement('div');grid.className='grid';
    for(const s of songs){
      const b=document.createElement('button');b.className='song';b.type='button';
      const left=(s.lo-21)/88*100,width=(s.hi-s.lo+1)/88*100,best=bestOf(s.id);
      b.innerHTML=`<div class="top"><div><b></b><small></small></div>${best?`<span class="badge">✓ ${best} s</span>`:''}</div>
        <div class="range" title="Tonumfang"><span style="left:${left}%;width:${width}%"></span></div>
        <div class="meta"><span class="hands">${s.two?'<i class="l"></i><i></i> 2 Hände':'<i></i> 1 Hand'}</span><span>${noteName(s.lo)}–${noteName(s.hi)}</span></div>`;
      b.querySelector('b').textContent=s.t;b.querySelector('small').textContent=s.c;
      b.onclick=()=>chooseSong(s);grid.append(b);
    }
    list.append(sec,grid);
  }
}
buildMenu();
async function goLandscape(){
  try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}
  try{await screen.orientation?.lock?.('landscape')}catch(e){}
  try{await navigator.wakeLock?.request('screen')}catch(e){}
}
async function chooseSong(s){
  noMic=$('noMic').checked;
  goLandscape();
  if(!noMic){const ok=await startMic();
    if(!ok){$('menuNote').textContent='Kein Mikrofon-Zugriff. Erlaube das Mikrofon in den Browser-Einstellungen oder wähle „Ohne Mikrofon“.';return}}
  $('menuNote').textContent='';
  $('menu').hidden=true;document.body.classList.add('playing');started=true;
  resize();loadSong(s);
}
function openMenu(){buildMenu();$('menu').hidden=false;$('menu').scrollTop=0;document.body.classList.remove('playing');started=false}
$('openMenu').onclick=openMenu;$('toMenu').onclick=openMenu;

// Startzustand: Menü offen, im Hintergrund das zuletzt gespielte Lied
resize();loadSong(SONGS.find(s=>s.id===load('tt-song'))||SONGS[0]);
requestAnimationFrame(draw);
</script>
</body>
