<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ton-Tiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen app — Kopfzeile, Spielfläche mit 7 Bahnen, Hörer-Anzeige, Klaviatur */
:root{
  --bg:#f3f1f6; --panel:#ffffff; --fg:#1d1a26; --muted:#6d6780;
  --lane:#e6e2ee; --tile:#2a2338; --tile-next:#5b3fd1; --done:#2fae7a; --wrong:#d9485f;
  --key:#ffffff; --key-edge:#cfc9da;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14111c; --panel:#1e1a29; --fg:#f1eef7; --muted:#9a93ad;
  --lane:#221d2f; --tile:#efeaf8; --tile-next:#8f74ff; --done:#3fd197; --wrong:#ff6b80;
  --key:#efeaf8; --key-edge:#3a3349; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);
  padding:env(safe-area-inset-top,0) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(12px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:10px}
h1{font-size:1.25rem;font-weight:800;margin:0;letter-spacing:-.02em;flex:1 1 auto}
select,button{font:600 .9rem var(--display);color:var(--fg);background:var(--panel);
  border:1px solid var(--key-edge);border-radius:10px;padding:8px 12px}
button.primary{background:var(--tile-next);color:#fff;border-color:transparent}
button:focus-visible,select:focus-visible{outline:2px solid var(--tile-next);outline-offset:2px}
label.chk{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
#stage{position:relative;flex:1 1 auto;min-height:0;border-radius:14px;overflow:hidden;background:var(--lane)}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;padding:20px;background:color-mix(in srgb,var(--bg) 82%,transparent)}
#overlay p{margin:0;max-width:30ch;color:var(--muted);line-height:1.4}
#overlay strong{font-size:1.6rem;color:var(--fg)}
#hud{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-block:8px}
#heard{font:600 1.5rem var(--mono)}
#want{font:500 .85rem var(--mono);color:var(--muted);text-align:right}
#meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--lane);overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--tile-next);transition:width .05s}
#keys{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:64px;margin-bottom:10px}
#keys button{background:var(--key);color:#1d1a26;border:1px solid var(--key-edge);border-radius:0 0 8px 8px;
  font:600 .85rem var(--mono);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
#keys button.lit{background:var(--tile-next);color:#fff}
@media (prefers-reduced-motion:reduce){#meter i{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Ton-Tiles</h1>
  <select id="song" aria-label="Lied"></select>
  <label class="chk"><input type="checkbox" id="strict"> Oktave prüfen</label>
  <button id="restart">Neu</button>
</header>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="overlay">
    <strong id="ovTitle">Spiel den Ton, dann geht's weiter</strong>
    <p id="ovText">Stell das Handy ans Klavier. Die App hört über das Mikrofon zu und schiebt erst weiter, wenn du die richtige Taste spielst. Zum Zurückspulen auf der Spielfläche nach oben wischen.</p>
    <button class="primary" id="start">Mikrofon starten</button>
    <button id="tapOnly">Ohne Mikrofon testen</button>
  </div>
</div>
<div id="hud">
  <div id="heard">–</div>
  <div id="want">Nächster: –</div>
  <div id="meter"><i></i></div>
</div>
<div id="keys"></div>

<script>
const NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','B','H'];
const LANE_OF_PC=[0,0,1,1,2,3,3,4,4,5,5,6]; // Kreuz-Töne landen auf der Bahn darunter
const WHITE_PC=[0,2,4,5,7,9,11];
// [MIDI-Ton, Länge in Vierteln]
const SONGS={
  "Alle meine Entchen":{bpm:100,n:[[60,1],[62,1],[64,1],[65,1],[67,2],[67,2],[69,1],[69,1],[69,1],[69,1],[67,4],[69,1],[69,1],[69,1],[69,1],[67,4],[65,1],[65,1],[65,1],[65,1],[64,2],[64,2],[62,1],[62,1],[62,1],[62,1],[60,4]]},
  "Ode an die Freude":{bpm:100,n:[[64,1],[64,1],[65,1],[67,1],[67,1],[65,1],[64,1],[62,1],[60,1],[60,1],[62,1],[64,1],[64,1.5],[62,.5],[62,2],[64,1],[64,1],[65,1],[67,1],[67,1],[65,1],[64,1],[62,1],[60,1],[60,1],[62,1],[64,1],[62,1.5],[60,.5],[60,2]]},
  "Hänschen klein":{bpm:110,n:[[67,1],[64,1],[64,2],[65,1],[62,1],[62,2],[60,1],[62,1],[64,1],[65,1],[67,1],[67,1],[67,2],[67,1],[64,1],[64,2],[65,1],[62,1],[62,2],[60,1],[64,1],[67,1],[67,1],[60,4]]},
  "C-Dur Tonleiter":{bpm:90,n:[[60,1],[62,1],[64,1],[65,1],[67,1],[69,1],[71,1],[72,2],[71,1],[69,1],[67,1],[65,1],[64,1],[62,1],[60,2]]}
};
const noteName=m=>NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const songSel=$('song');
Object.keys(SONGS).forEach(n=>{const o=document.createElement('option');o.textContent=n;songSel.append(o)});
try{const s=localStorage.getItem('tt-song');if(s&&SONGS[s])songSel.value=s;
  $('strict').checked=localStorage.getItem('tt-strict')==='1'}catch(e){}

// Klaviatur (auch zum Testen per Tippen)
WHITE_PC.forEach((pc,i)=>{const b=document.createElement('button');b.textContent=NAMES[pc];b.id='k'+i;
  b.addEventListener('pointerdown',()=>{flashKey(i);tryHit(60+pc,true)});$('keys').append(b)});
function flashKey(i){const b=$('k'+i);b.classList.add('lit');setTimeout(()=>b.classList.remove('lit'),180)}

let notes=[],starts=[],lens=[],bpm=100,totalBeats=0,idx=0,pos=0,lastFrame=0,started=false,wrongFlash=0,doneAt=0,startTime=0;
function reset(){
  const s=SONGS[songSel.value];bpm=s.bpm;notes=s.n.map(x=>x[0]);lens=s.n.map(x=>x[1]);
  starts=[];let b=0;lens.forEach(l=>{starts.push(b);b+=l});totalBeats=b;
  idx=0;pos=0;doneAt=0;startTime=performance.now();updateWant()}
function updateWant(){$('want').textContent=idx<notes.length?`Nächster: ${noteName(notes[idx])} · ${idx}/${notes.length}`:`Fertig · ${notes.length}/${notes.length}`}
songSel.onchange=()=>{try{localStorage.setItem('tt-song',songSel.value)}catch(e){}reset()};
$('strict').onchange=e=>{try{localStorage.setItem('tt-strict',e.target.checked?'1':'0')}catch(err){}};
$('restart').onclick=reset;

function matches(played,target,fromTap){
  if($('strict').checked&&!fromTap)return played===target;
  return ((played-target)%12+12)%12===0;
}
function tryHit(midi,fromTap){
  if(!started||idx>=notes.length)return;
  if(matches(midi,notes[idx],fromTap)){
    idx++;armed=false;lastHitAt=performance.now();updateWant();
    if(navigator.vibrate)navigator.vibrate(15);
  }else if(fromTap){wrongFlash=performance.now()}
}

// ---------- Tonerkennung ----------
let audioCtx,analyser,buf,lastRms=0,lastHitAt=0,armed=false,stableMidi=null,stableCount=0,rmsHist=[];
const GATE=0.012;
function detectPitch(b,sr){
  const n=b.length;let rms=0;for(let i=0;i<n;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/n);
  if(rms<GATE)return{rms,f:-1};
  const minLag=Math.floor(sr/2100),maxLag=Math.min(Math.floor(sr/55),n>>1);
  const c=new Float32Array(maxLag+2);
  for(let lag=0;lag<=maxLag+1;lag++){let s=0;for(let i=0;i<n-lag;i++)s+=b[i]*b[i+lag];c[lag]=s}
  let d=minLag;while(d<maxLag&&c[d]>c[d+1])d++;
  let best=-1,bestV=-Infinity;for(let i=d;i<=maxLag;i++)if(c[i]>bestV){bestV=c[i];best=i}
  if(best<=0||bestV<c[0]*0.3)return{rms,f:-1};
  // kleinsten Lag nehmen, der fast so stark ist (gegen Oktavfehler nach unten)
  for(let i=d;i<best;i++){if(c[i]>bestV*0.92&&c[i]>=c[i-1]&&c[i]>=c[i+1]){best=i;break}}
  const x1=c[best-1],x2=c[best],x3=c[best+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;
  const T=a?best-bb/(2*a):best;
  return{rms,f:sr/T};
}
function listen(){
  if(!analyser)return;
  analyser.getFloatTimeDomainData(buf);
  const {rms,f}=detectPitch(buf,audioCtx.sampleRate);
  lastRms=rms;
  // Neuer Anschlag = Lautstärke springt deutlich nach oben (Ausklingen zählt nicht)
  const recentMin=rmsHist.length?Math.min(...rmsHist):0;
  const now=performance.now();
  if(rms>GATE*1.5&&rms>recentMin*1.7&&now-lastHitAt>150){armed=true;stableMidi=null;stableCount=0}
  rmsHist.push(rms);if(rmsHist.length>10)rmsHist.shift();
  $('meter').firstElementChild.style.width=Math.min(100,rms*600)+'%';
  if(f>0){
    const mf=69+12*Math.log2(f/440),m=Math.round(mf),cents=Math.round((mf-m)*100);
    $('heard').textContent=`${noteName(m)}  ${f.toFixed(0)} Hz  ${cents>=0?'+':''}${cents}¢`;
    if(m===stableMidi)stableCount++;else{stableMidi=m;stableCount=1}
    if(stableCount>=3&&armed)tryHit(m,false);
  }else{stableMidi=null;stableCount=0;if(rms<GATE)$('heard').textContent='–'}
}
async function startMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=2048;buf=new Float32Array(analyser.fftSize);
    src.connect(analyser);
    try{await navigator.wakeLock?.request('screen')}catch(e){}
    begin();
  }catch(e){
    $('ovTitle').textContent='Kein Mikrofon-Zugriff';
    $('ovText').textContent='Erlaube das Mikrofon in den Browser-Einstellungen. Die Seite muss über https:// geöffnet sein.';
  }
}
function begin(){started=true;$('overlay').hidden=true;reset()}
$('start').onclick=startMic;
$('tapOnly').onclick=begin;

// ---------- Zeichnen ----------
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
let colors={};function readColors(){['--lane','--tile','--tile-next','--done','--wrong','--bg','--muted','--fg'].forEach(k=>colors[k]=css(k))}
readColors();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',readColors);
function resize(){const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function draw(t){
  listen();
  const W=cv.clientWidth,H=cv.clientHeight,laneW=W/7,ppb=Math.max(56,H/6),hitY=H-Math.max(60,H*.18);
  // Position (in Vierteln) gleitet im Liedtempo bis zum Anfang der nächsten wartenden Note
  const dt=Math.min(.05,(t-(lastFrame||t))/1000);lastFrame=t;
  const limit=idx<notes.length?starts[idx]:totalBeats,gap=limit-pos;
  lastPpb=ppb;
  if(!dragging&&gap>0){const speed=Math.max(bpm/60,gap*5);pos=Math.min(limit,pos+speed*dt)}
  else if(!dragging&&gap<0){pos=Math.max(limit,pos+gap*Math.min(1,dt*14))}
  if(!doneAt&&started&&idx>=notes.length&&pos>=totalBeats-1e-6)doneAt=performance.now();
  ctx.fillStyle=colors['--lane'];ctx.fillRect(0,0,W,H);
  // Taktraster: dünne Linie pro Viertel, kräftiger pro Takt
  for(let b=Math.floor(pos-(H-hitY)/ppb);b<=pos+hitY/ppb+1;b++){
    const y=hitY-(b-pos)*ppb;ctx.fillStyle=colors['--muted'];
    ctx.globalAlpha=b%4===0?.28:.09;ctx.fillRect(0,y,W,b%4===0?2:1)}
  ctx.globalAlpha=1;ctx.strokeStyle=colors['--bg'];ctx.lineWidth=2;
  for(let i=1;i<7;i++){ctx.beginPath();ctx.moveTo(i*laneW,0);ctx.lineTo(i*laneW,H);ctx.stroke()}
  ctx.font='600 14px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<notes.length;i++){
    const bottom=hitY-(starts[i]-pos)*ppb,h=lens[i]*ppb,top=bottom-h;
    if(top>H)continue;if(bottom<0)break;
    const lane=LANE_OF_PC[notes[i]%12],x=lane*laneW+3,w=laneW-6;
    const playing=i<idx&&pos<starts[i]+lens[i];
    let col=colors['--tile'];
    if(i<idx)col=colors['--done'];
    else if(i===idx)col=(t-wrongFlash<200)?colors['--wrong']:colors['--tile-next'];
    ctx.fillStyle=col;roundRect(x,top+2,w,h-4,8);ctx.fill();
    if(playing){ // klingende Note leuchtet, solange sie durch die Linie läuft
      ctx.globalAlpha=.35+.25*Math.sin(t/90);ctx.fillStyle='#fff';
      roundRect(x+3,Math.max(top+5,0),w-6,Math.max(0,hitY-Math.max(top+5,0)),6);ctx.fill();ctx.globalAlpha=1}
    ctx.fillStyle=i<=idx?'#fff':colors['--lane'];
    const ly=Math.min(bottom-16,Math.max(top+16,Math.min(hitY-16,bottom-16)));
    ctx.fillText(noteName(notes[i]),x+w/2,ly);
    if(i===idx&&started){ // pulsierender Rahmen am wartenden Tile
      ctx.strokeStyle=colors['--tile-next'];ctx.lineWidth=2;ctx.globalAlpha=.4+.3*Math.sin(t/200);
      roundRect(x-2,top,w+4,h,10);ctx.stroke();ctx.globalAlpha=1}
  }
  // Bereich unter der Trefferlinie abdunkeln = schon gespielt
  ctx.fillStyle=colors['--lane'];ctx.globalAlpha=.72;ctx.fillRect(0,hitY,W,H-hitY);ctx.globalAlpha=1;
  ctx.fillStyle=colors['--tile-next'];ctx.fillRect(0,hitY-1.5,W,3);
  if(doneAt){
    const secs=((doneAt-startTime)/1000).toFixed(1);
    ctx.fillStyle=colors['--fg'];ctx.font='800 28px "Bricolage Grotesque",sans-serif';
    ctx.fillText('Geschafft!',W/2,H/2-18);
    ctx.font='500 15px "IBM Plex Mono",monospace';ctx.fillStyle=colors['--muted'];
    ctx.fillText(`${notes.length} Töne in ${secs} s`,W/2,H/2+16);
  }
  requestAnimationFrame(draw);
}
// ---------- Spulen: Wischen auf der Spielfläche oder Mausrad ----------
let lastPpb=60,dragging=false,dragY=0,dragPos=0,wheelTimer=null;
cv.style.touchAction='none';
function snapToNearest(){
  let best=0,bd=Infinity;
  starts.forEach((s,i)=>{const d=Math.abs(s-pos);if(d<bd){bd=d;best=i}});
  if(pos>=totalBeats-.25)best=notes.length;
  idx=best;doneAt=0;armed=false;lastHitAt=performance.now();updateWant();
}
cv.addEventListener('pointerdown',e=>{if(!started)return;dragging=true;dragY=e.clientY;dragPos=pos;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dragging)return;
  pos=Math.max(0,Math.min(totalBeats,dragPos+(e.clientY-dragY)/lastPpb))});
const endDrag=()=>{if(!dragging)return;dragging=false;snapToNearest()};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{if(!started)return;e.preventDefault();dragging=true;
  pos=Math.max(0,Math.min(totalBeats,pos+e.deltaY/lastPpb*.6));
  clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{dragging=false;snapToNearest()},220)},{passive:false});

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
reset();requestAnimationFrame(draw);
</script>
</body>
</html>
